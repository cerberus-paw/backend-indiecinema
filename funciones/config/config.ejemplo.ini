; Copiar a config.ini, que no se versiona. Es lo único que cambia entre desarrollo y el VPS.

[app]
; Elige la carpeta de plantillas del subsistema en el paquete front (plantillas/funciones/).
subsistema = "funciones"
; nginx le pasa las rutas sin el prefijo; el subsistema lo repone al armar los links.
prefijo = "/funcion"
; «desarrollo» muestra el detalle de los errores; en el VPS, «produccion», y entonces el
; subsistema no arranca si queda algún «cambiar» de este ejemplo.
entorno = "desarrollo"

[base]
; Usuario propio del subsistema: sólo datos (sin CREATE, ALTER ni DROP) y sólo sobre su esquema.
host = "mysql"
puerto = 3306
esquema = "funciones"
usuario = "funciones"
clave = "cambiar"

[subsistemas]
; Dónde está cada uno de los otros, para las llamadas a /interno/: el nombre del servicio en el
; compose y el puerto de Apache (8080, porque corre sin privilegios).
cuentas = "http://cuentas:8080"
programacion = "http://programacion:8080"

[interno]
; Token con el que este subsistema se identifica al llamar a /interno/ de otro (va en
; «Authorization: Bearer …»). Uno largo y al azar: openssl rand -hex 32
token = "cambiar"

[llamadores]
; Quién puede llamar a las rutas /interno/ de este subsistema: el SHA-256 del token de cada uno,
; nunca el token, así este archivo no sirve para hacerse pasar por otro. Se calcula con
;   php -r 'echo hash("sha256", "<token>"), PHP_EOL;'
; El ejemplo tiene el de «cambiar», que es el token de los ejemplos de los otros.
cuentas = "d3fd787ac1c5e27fb71acd2e207ed438c0cda22234d2e5a2ca3d201d657b3d30"
programacion = "d3fd787ac1c5e27fb71acd2e207ed438c0cda22234d2e5a2ca3d201d657b3d30"

[nginx]
; Secreto que agrega nginx en X-Nginx-Secreto: sin él no se confía en X-Usuario-Id, X-Rol ni
; X-Usuario-Nombre. Distinto para cada subsistema, y el mismo que NGINX_SECRETO_FUNCIONES de .env.
secreto = "cambiar"

[sitio]
; La dirección pública del sitio, sin la barra final: arma el enlace al comprobante del correo de
; la reserva confirmada. En el VPS, la del dominio con https://.
url = "http://localhost:8080"

[correo]
; Por dónde salen los avisos a los espectadores (la reserva confirmada y la función que reservaron
; se canceló). En desarrollo, el buzón de prueba del compose, que muestra lo que llega en
; http://localhost:8025. En el VPS, el servidor del proveedor de correo con smtps://, o con
; smtp:// y starttls = true, y su usuario y su clave: sin cifrado no se manda la clave.
servidor = "smtp://buzon:1025"
starttls = false
usuario = ""
clave = ""
; Quién figura como remitente.
remitente = "no-responder@indiecinema.test"
nombre = "IndieCinema"

[mercadopago]
; El cobro de las entradas con Checkout Pro (X-01). Con activo = false, o sin esta sección, una
; función paga se confirma sin cobrar, como antes del extra.
activo = false
; El access token (APP_USR-…) de la cuenta vendedora: la del vendedor de prueba mientras el sitio
; no cobre de verdad (cómo se saca, en el README). Sólo va acá, nunca en el repositorio: gitleaks
; lo frena.
access_token = "cambiar"
; La clave secreta con la que Mercado Pago firma los avisos de pago: en la misma aplicación,
; «Webhooks», «Configurar notificaciones».
clave_webhook = "cambiar"
; Cuánto tiene el espectador para pagar antes de que su reserva suelte los lugares.
minutos_para_pagar = 15
