; Copiar a config.ini, que no se versiona. Es lo único que cambia entre desarrollo y el VPS.

[app]
; Elige la carpeta de plantillas del subsistema en el paquete front (plantillas/cuentas/).
subsistema = "cuentas"
; nginx le pasa las rutas sin el prefijo; el subsistema lo repone al armar los links.
prefijo = "/cuenta"
entorno = "desarrollo"

[base]
; Usuario propio del subsistema: sólo datos (sin CREATE, ALTER ni DROP) y sólo sobre su esquema.
host = "mysql"
esquema = "cuentas"
usuario = "cuentas"
clave = "cambiar"

[interno]
; Token con el que este subsistema se identifica al llamar a /interno/ de otro.
token = "cambiar"

[nginx]
; Secreto que agrega nginx en X-Nginx-Secreto: sin él no se confía en X-Usuario-Id, X-Rol ni
; X-Usuario-Nombre. Distinto para cada subsistema.
secreto = "cambiar"
