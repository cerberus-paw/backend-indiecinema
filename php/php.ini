; Lo que cambia respecto de php.ini-production.

; Sin «X-Powered-By: PHP/8.4…» en las respuestas.
expose_php = Off

; Los errores que no atrapa el núcleo (por ejemplo, si no arranca) van a la salida del contenedor.
log_errors = On
error_log = /dev/stderr

; Imagen de la sala y afiche de la obra. nginx tiene el mismo límite (client_max_body_size).
upload_max_filesize = 5M
post_max_size = 6M
