# Despliegue continuo: cuando la CI pasa en un push a main o a dev, publica esa versión en su
# servidor: main en producción y dev en el de desarrollo (README, «Ramas y entornos»). Entra
# por SSH con la clave del secreto SSH_CLAVE_DESPLIEGUE de cada environment, que en el servidor sólo
# puede correr herramientas/desplegar.sh (README, «Despliegue continuo»). El front tiene el mismo
# workflow, y los dos corren ese script, que trae los dos repositorios.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  # Para volver a desplegar a mano, desde la pestaña Actions, eligiendo la rama.
  workflow_dispatch:

# No lee ni escribe nada del repositorio: sólo entra al servidor.
permissions: {}

# Uno por vez en cada servidor y sin cancelar: cortar un despliegue a mitad de una migración es peor
# que esperar. Producción y desarrollo no se esperan entre sí.
concurrency:
  group: despliegue-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  desplegar:
    name: Desplegar ${{ github.event.workflow_run.head_branch || github.ref_name }}
    # Sólo main y dev, y sólo si la CI pasó en un push: también corre en los PR. La rama
    # elige el environment y no al revés: workflow_run corre siempre en la rama por defecto, así que
    # la política de ramas del environment no alcanza para separar los dos servidores.
    if: >-
      contains(fromJSON('["main", "dev"]'), github.event.workflow_run.head_branch || github.ref_name)
      && (github.event_name == 'workflow_dispatch'
        || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Cada environment guarda la clave y la dirección de su servidor.
    environment:
      name: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'produccion' || 'desarrollo' }}
      url: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'https://indiecinema.duckdns.org' || 'https://indiecinema-dev.duckdns.org' }}
    steps:
      - name: Clave y huella del servidor
        env:
          CLAVE: ${{ secrets.SSH_CLAVE_DESPLIEGUE }}
          HUELLA: ${{ vars.SSH_HUELLA_SERVIDOR }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/despliegue
          chmod 600 ~/.ssh/despliegue
          printf '%s\n' "$HUELLA" > ~/.ssh/known_hosts
      # Sin comando: lo elige el servidor. Si la huella no coincide, no se conecta.
      - name: Desplegar
        env:
          SERVIDOR: ${{ vars.SERVIDOR }}
        run: ssh -i ~/.ssh/despliegue -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes "$SERVIDOR"

  # Después de publicar dev, las pruebas de punta a punta contra ese sitio: el workflow E2E
  # del front, de su rama dev, porque las pruebas viven allá. La corrida queda en verde o en
  # rojo según pasen. Usan la cuenta y la función del environment desarrollo de este repositorio,
  # distintas en el back y en el front para que no se pisen si los dos despliegan a la vez.
  e2e:
    name: Pruebas de punta a punta
    needs: desplegar
    if: (github.event.workflow_run.head_branch || github.ref_name) == 'dev'
    permissions:
      contents: read
    uses: cerberus-paw/frontend-indiecinema/.github/workflows/e2e.yml@dev
    # Un workflow reutilizable recibe las variables del environment, pero no los secretos: sin
    # esto, E2E_CORREO y E2E_CLAVE llegan vacíos y las pruebas no pueden ingresar.
    secrets: inherit

  # También después de publicar dev, el análisis pasivo de OWASP ZAP (zap-baseline) contra ese
  # sitio: recorre las páginas públicas y revisa cada respuesta (cabeceras, cookies, formularios)
  # sin atacarlo. Falla con cualquier alerta media o alta que no esté revisada en .zap/reglas.tsv
  # (docs/seguridad.md, «Análisis con OWASP ZAP»). Sin sesión y sin que el spider mande los
  # formularios por POST (spider.postform): con sesión podría cancelar las funciones o llenar el
  # cupo que usan las pruebas de punta a punta, que corren al mismo tiempo. Sólo quedan un POST a
  # ingresar y otro a registro sin el token, que el CSRF rechaza con 403. El escaneo activo, con
  # sesión, se corre a mano contra el compose local.
  zap:
    name: Análisis con OWASP ZAP
    needs: desplegar
    if: (github.event.workflow_run.head_branch || github.ref_name) == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SITIO: https://indiecinema-dev.duckdns.org/
    steps:
      # Las reglas de la versión que se acaba de publicar.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: .zap
      # -I: que una alerta no haga fallar este paso; lo decide el que sigue, por el riesgo y no por
      # la regla. La imagen corre como otro usuario y escribe el informe en la carpeta montada.
      # La versión estable y no una fija: una regla nueva que encuentre algo es lo que se quiere ver.
      - name: Escaneo pasivo del sitio de desarrollo
        run: |
          install -d -m 777 informe
          cp .zap/reglas.tsv informe/
          docker run --rm -v "$PWD/informe:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$SITIO" -c reglas.tsv -r zap.html -J zap.json -I \
            -z "-config spider.postform=false"
      # Las reglas en IGNORE siguen apareciendo en el JSON: se descuentan acá.
      - name: Ninguna alerta media o alta sin revisar
        run: |
          revisadas=$(awk -F '\t' '$2 == "IGNORE" { print $1 }' .zap/reglas.tsv | jq -R . | jq -s .)
          jq -r --argjson revisadas "$revisadas" '
            [.site[].alerts[] | select((.riskcode | tonumber) >= 2 and (.pluginid | IN($revisadas[]) | not))]
            | map("::error::\(.riskdesc) · \(.name) [\(.pluginid)] en \(.count) URL") | .[]' informe/zap.json | tee alertas
          if [[ -s alertas ]]; then
            echo "Hay alertas medias o altas sin revisar: ver el informe (artefacto informe-zap)."
            exit 1
          fi
          echo "Ninguna alerta media o alta sin revisar."
      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-zap
          path: informe/zap.html
          retention-days: 14
