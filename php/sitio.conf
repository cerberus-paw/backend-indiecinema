# Un solo sitio: el public/ del subsistema, que define el compose en APACHE_DOCUMENT_ROOT.
ServerName localhost
# Sin versión de Apache ni de PHP en las cabeceras ni en las páginas de error.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8080>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Require all granted
        # Sin .htaccess ni listado de carpetas: lo que se sirve está decidido acá.
        AllowOverride None
        Options -Indexes -FollowSymLinks
        # Todo lo que no es un archivo de public/ va al único punto de entrada.
        FallbackResource /index.php
    </Directory>

    # El registro de accesos ya lo lleva nginx, con la IP real; acá sólo los errores, que van
    # a la salida del contenedor igual que el log de la aplicación.
    ErrorLog /dev/stderr
</VirtualHost>
