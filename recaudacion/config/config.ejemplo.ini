; Copiar a config.ini, que no se versiona. Es lo único que cambia entre desarrollo y el VPS.

[app]
; Elige la carpeta de plantillas del subsistema en el paquete front (plantillas/recaudacion/).
subsistema = "recaudacion"
; nginx le pasa las rutas sin el prefijo; el subsistema lo repone al armar los links.
prefijo = "/recaudacion"
; «desarrollo» muestra el detalle de los errores; en el VPS, «produccion», y entonces el
; subsistema no arranca si queda algún «cambiar» de este ejemplo.
entorno = "desarrollo"

[base]
; Usuario propio del subsistema: sólo datos (sin CREATE, ALTER ni DROP) y sólo sobre su esquema.
host = "mysql"
puerto = 3306
esquema = "recaudacion"
usuario = "recaudacion"
clave = "cambiar"

[subsistemas]
; Dónde está cada uno de los otros, para las llamadas a /interno/: el nombre del servicio en el
; compose y el puerto de Apache (8080, porque corre sin privilegios).
cuentas = "http://cuentas:8080"
programacion = "http://programacion:8080"
funciones = "http://funciones:8080"
moderacion = "http://moderacion:8080"

[interno]
; Token con el que este subsistema se identifica al llamar a /interno/ de otro (va en
; «Authorization: Bearer …»). Uno largo y al azar: openssl rand -hex 32
token = "cambiar"

[llamadores]
; Quién puede llamar a las rutas /interno/ de este subsistema: el SHA-256 del token de cada uno,
; nunca el token, así este archivo no sirve para hacerse pasar por otro. Se calcula con
;   php -r 'echo hash("sha256", "<token>"), PHP_EOL;'
; El ejemplo tiene el de «cambiar», que es el token de los ejemplos de los otros.
cuentas = "d3fd787ac1c5e27fb71acd2e207ed438c0cda22234d2e5a2ca3d201d657b3d30"
programacion = "d3fd787ac1c5e27fb71acd2e207ed438c0cda22234d2e5a2ca3d201d657b3d30"
funciones = "d3fd787ac1c5e27fb71acd2e207ed438c0cda22234d2e5a2ca3d201d657b3d30"
moderacion = "d3fd787ac1c5e27fb71acd2e207ed438c0cda22234d2e5a2ca3d201d657b3d30"

[nginx]
; Secreto que agrega nginx en X-Nginx-Secreto: sin él no se confía en X-Usuario-Id, X-Rol ni
; X-Usuario-Nombre. Distinto para cada subsistema, y el mismo que NGINX_SECRETO_RECAUDACION de .env.
secreto = "cambiar"

[reportes]
; Desde dónde el reporte sugiere algo (EF-09.1). Los porcentajes son enteros, de 0 a 100.
; Un día de la semana con esta ocupación o menos, y con al menos estas funciones, sugiere una
; promoción ese día (si además vende menos que el resto de la semana).
dia_flojo_ocupacion_maxima = 50
dia_flojo_funciones_minimas = 2
; Un título para repetir llenó este porcentaje de los lugares o más, fue este porcentaje de los
; que reservaron o más, y lo calificaron con este promedio o más (de 1 a 5).
repetir_ocupacion_minima = 90
repetir_asistencia_minima = 80
repetir_promedio_minimo = 4
; Una obra que perdió una votación con este porcentaje de los votos o más es algo que el público
; pidió y no vio.
pedido_votos_minimos = 30
; Una sala que llena a la gorra al menos estos puntos más que con precio, con al menos estas
; funciones de cada tipo, tiene un público sensible al precio: sugiere un descuento. Si con precio
; llena igual o más, sugiere cobrar (EF-09.5).
gorra_diferencia_minima = 20
gorra_funciones_minimas = 2
; Una sala con al menos estas personas que votaron y no reservaron ninguna función sugiere una
; promoción para traerlas.
votaron_sin_reservar_minimos = 5
; Una función que vendió este porcentaje de los lugares o más se agotó: sugiere sumar otra.
agotada_ocupacion_minima = 95
; Las funciones antes de esta hora son de la tarde y las demás, de la noche. Si en una sala una
; franja llena estos puntos más que la otra (con al menos estas funciones en cada una) y su día
; flojo cae en la que llena menos, sugiere cambiarle el horario (EF-22.3, docs/recomendaciones.md).
franja_corte_hora = 20
franja_diferencia_minima = 20
franja_funciones_minimas = 2
; Una sala que se lleva este porcentaje más de lo que le cuesta abrir sus funciones gana holgado:
; el reporte no le sugiere promociones ni descuentos (EF-22.14). Puede pasar de 100.
promocion_ganancia_maxima = 40
; Cuánto le saca al precio de siempre la promoción del día flojo, en porcentaje, cuando el botón
; «Programarla» abre el alta de la función ya cargada (EF-22.17).
promocion_descuento = 20
; Con qué se compara lo cobrado para ver si alguien gana o pierde plata (EF-22.1), en pesos. Lo
; que le cuesta a una sala abrir para una función (alquiler, luz, la persona en la puerta), si su
; organizador no cargó el suyo en los reportes.
costo_funcion = 50000
; Lo que paga la plataforma por mes: los servidores con el dominio, y el desarrollo y el
; mantenimiento. Se cuentan por día, con meses de 30.
plataforma_servidores_mes = 30000
plataforma_desarrollo_mes = 120000

[reparto]
; El porcentaje que se queda Mercado Pago de cada cobro: se descuenta antes de repartir (EF-22.1).
; 7,61 es el 6,29 % más IVA, con la plata disponible en el momento (Checkout Pro, Argentina).
comision_mercadopago = 7.61
