; Copiar a config.ini, que no se versiona. Es lo único que cambia entre desarrollo y el VPS.

[app]
; Elige la carpeta de plantillas del subsistema en el paquete front (plantillas/programacion/).
subsistema = "programacion"
; nginx le pasa las rutas sin el prefijo; el subsistema lo repone al armar los links.
prefijo = ""
; «desarrollo» muestra el detalle de los errores; en el VPS, «produccion», y entonces el
; subsistema no arranca si queda algún «cambiar» de este ejemplo.
entorno = "desarrollo"

[base]
; Usuario propio del subsistema: sólo datos (sin CREATE, ALTER ni DROP) y sólo sobre su esquema.
host = "mysql"
puerto = 3306
esquema = "programacion"
usuario = "programacion"
clave = "cambiar"

[archivos]
; Dónde se guardan las imágenes de las salas: el volumen archivos-programacion del compose, fuera
; del webroot.
carpeta = "/var/indiecinema/archivos"

[subsistemas]
; Dónde está cada uno de los otros, para las llamadas a /interno/: el nombre del servicio en el
; compose y el puerto de Apache (8080, porque corre sin privilegios).
cuentas = "http://cuentas:8080"
funciones = "http://funciones:8080"

[interno]
; Token con el que este subsistema se identifica al llamar a /interno/ de otro (va en
; «Authorization: Bearer …»). Uno largo y al azar: openssl rand -hex 32
token = "cambiar"

[llamadores]
; Quién puede llamar a las rutas /interno/ de este subsistema: el SHA-256 del token de cada uno,
; nunca el token, así este archivo no sirve para hacerse pasar por otro. Se calcula con
;   php -r 'echo hash("sha256", "<token>"), PHP_EOL;'
; El ejemplo tiene el de «cambiar», que es el token de los ejemplos de los otros.
cuentas = "d3fd787ac1c5e27fb71acd2e207ed438c0cda22234d2e5a2ca3d201d657b3d30"
funciones = "d3fd787ac1c5e27fb71acd2e207ed438c0cda22234d2e5a2ca3d201d657b3d30"

[nginx]
; Secreto que agrega nginx en X-Nginx-Secreto: sin él no se confía en X-Usuario-Id, X-Rol ni
; X-Usuario-Nombre. Distinto para cada subsistema, y el mismo que NGINX_SECRETO_PROGRAMACION de .env.
secreto = "cambiar"
