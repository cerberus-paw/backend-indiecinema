; Copiar a config.ini, que no se versiona. Es lo único que cambia entre desarrollo y el VPS.

[app]
; Elige la carpeta de plantillas del subsistema en el paquete front (plantillas/moderacion/).
subsistema = "moderacion"
; nginx le pasa las rutas sin el prefijo; el subsistema lo repone al armar los links.
prefijo = "/moderacion"
; «desarrollo» muestra el detalle de los errores; en el VPS, «produccion», y entonces el
; subsistema no arranca si queda algún «cambiar» de este ejemplo.
entorno = "desarrollo"

[archivos]
; Dónde se guardan las fotos que mandan las solicitudes de sala: el volumen archivos-moderacion del
; compose, fuera del webroot.
carpeta = "/var/indiecinema/archivos"

[base]
; Usuario propio del subsistema: sólo datos (sin CREATE, ALTER ni DROP) y sólo sobre su esquema.
host = "mysql"
puerto = 3306
esquema = "moderacion"
usuario = "moderacion"
clave = "cambiar"

[subsistemas]
; Dónde está cada uno de los otros, para las llamadas a /interno/: el nombre del servicio en el
; compose y el puerto de Apache (8080, porque corre sin privilegios).
cuentas = "http://cuentas:8080"
programacion = "http://programacion:8080"
funciones = "http://funciones:8080"
recaudacion = "http://recaudacion:8080"

[interno]
; Token con el que este subsistema se identifica al llamar a /interno/ de otro (va en
; «Authorization: Bearer …»). Uno largo y al azar: openssl rand -hex 32
token = "cambiar"

[llamadores]
; Quién puede llamar a las rutas /interno/ de este subsistema: el SHA-256 del token de cada uno,
; nunca el token, así este archivo no sirve para hacerse pasar por otro. Se calcula con
;   php -r 'echo hash("sha256", "<token>"), PHP_EOL;'
; El ejemplo tiene el de «cambiar», que es el token de los ejemplos de los otros.
cuentas = "d3fd787ac1c5e27fb71acd2e207ed438c0cda22234d2e5a2ca3d201d657b3d30"
programacion = "d3fd787ac1c5e27fb71acd2e207ed438c0cda22234d2e5a2ca3d201d657b3d30"
funciones = "d3fd787ac1c5e27fb71acd2e207ed438c0cda22234d2e5a2ca3d201d657b3d30"
recaudacion = "d3fd787ac1c5e27fb71acd2e207ed438c0cda22234d2e5a2ca3d201d657b3d30"

[nginx]
; Secreto que agrega nginx en X-Nginx-Secreto: sin él no se confía en X-Usuario-Id, X-Rol ni
; X-Usuario-Nombre. Distinto para cada subsistema, y el mismo que NGINX_SECRETO_MODERACION de .env.
secreto = "cambiar"

[correo]
; Por dónde salen los correos. En desarrollo, el buzón de prueba del compose, que muestra lo que
; llega en http://localhost:8025. En el VPS, el servidor del proveedor de correo con smtps://, o
; con smtp:// y starttls = true, y su usuario y su clave: sin cifrado no se manda la clave.
servidor = "smtp://buzon:1025"
starttls = false
usuario = ""
clave = ""
; Quién figura como remitente.
remitente = "no-responder@indiecinema.test"
nombre = "IndieCinema"

[solicitudes]
; A dónde le llega al equipo cada solicitud de sala, para que la revise en la bandeja.
destino = "equipo@indiecinema.test"
; EF-22.10: cuántos días tiene el solicitante para completar una solicitud devuelta, contados desde
; la devolución (una nueva devolución los vuelve a contar). Pasado el plazo, la tarea
; vencer-devueltas la cierra como vencida.
plazo_devolucion_dias = 15
; Cuántos días antes de que venza el plazo le llega el recordatorio, una sola vez.
recordatorio_devolucion_dias = 3

[denuncias]
; Las reglas de las denuncias (EF-22.11): cuentan, por sala, los denunciantes distintos con una
; denuncia media resuelta (también tomada) sobre la sala o sus funciones, creada en los últimos
; «dias» días. Con aviso_cantidad le llega un aviso al organizador; con cartelera_cantidad, sus
; funciones van al final de la cartelera hasta que las denuncias salgan del período (y también se
; le avisa).
aviso_cantidad = 3
cartelera_cantidad = 5
dias = 30

[documentos]
; Desde qué día se les exige el seguro y la habilitación a las salas que ya estaban publicadas
; (EF-07.5): la tarea suspender-vencidas les avisa ese día, otra vez siete días antes del fin del
; plazo, y pasados 30 días las suspende si les falta alguno. Va la fecha del despliegue. Sin la
; clave no se les exige nada (las salas nuevas los traen con la solicitud).
; exigible_desde = "2026-12-01"
